discovery:
  open_web: true
  mandatory_sources_are_not_whitelist: true
  mandatory_sources_have_no_editorial_priority: true
  catalog_sources_have_no_editorial_priority: true
  lookback: "since_previous_brief"
  fallback_lookback_hours: 36
  categories:
    - business_strategy
    - product_launches
    - partnerships
    - funding_and_acquisitions
    - regulation
    - models_llm_vlm_image_video
    - agents
    - coding_agents
    - open_source
    - inference_and_serving
    - benchmarks
    - research
    - developer_tools
    - ai_security
    - enterprise_adoption
    - productivity_and_reliability
    - compute_and_semiconductors
    - china_ai
  community_and_social:
    use_for_discovery: true
    sufficient_as_sole_evidence: false
  verification:
    prefer_primary_sources: true
    verify_material_claims: true
    independent_secondary_source_when_material_or_contested: true

intelligence_passes:
  emerging_signals:
    enabled: true
    minimum_independent_evidence_types: 2
    require_directional_consistency: true
    persist_recurring_signals_to_storylines: true
  contrarian_evidence:
    enabled: true
    run_for_major_vendor_claims: true
    run_for_dominant_market_narratives: true
    preferred_evidence:
      - production_metrics
      - independent_benchmarks
      - incident_postmortems
      - regulatory_filings
      - reproducible_experiments
      - credible_independent_reporting
    do_not_force_false_balance: true
  builder_radar:
    enabled: true
    max_items: 3
    require_concrete_action: true
    dimensions:
      - what_is_it
      - why_now
      - what_to_try
      - success_or_failure_signal
      - maturity_and_risk

source_catalog_growth:
  enabled: true
  principle: "promote_repeatedly_useful_sources"
  evaluate_new_sources_during_every_run: true
  add_to_mandatory_when:
    - "The source repeatedly surfaces high-signal AI developments early or reliably."
    - "The source is a new primary source from an important lab, company, project, regulator, standards body, repository or research organization."
    - "The source provides unique technical depth or evidence that materially improves the brief."
    - "The source has demonstrated sufficient reliability to justify daily checking."
  do_not_add_when:
    - "The source was useful only once with no indication of recurring value."
    - "The source mainly republishes or lightly rewrites material already covered by stronger sources."
    - "The source has weak provenance, poor reliability or unclear authorship."
    - "The source is primarily promotional noise without recurring editorial value."
  maintenance:
    allow_reclassification: true
    allow_removal: true
    remove_or_demote_when: "A source becomes stale, low-signal, redundant or unreliable over time."
    record_reason_in_commit_message: true

# Tiers describe evidentiary authority, not how aggressively a source is checked.
source_tiers:
  1: "Primary evidence: vendor announcement/docs, paper, repository, regulator, standards body or other authoritative original source"
  2: "High-quality independent reporting such as Reuters, Bloomberg, FT, Ars Technica or TechCrunch"
  3: "Curated discovery/analysis sources such as Ben's Bites, AI Weekly, Latent Space or Interconnects"
  4: "Community/social/aggregator signals; discovery only unless independently verified"

selection:
  principle: "story_merit_over_source_prominence"
  deduplicate_same_event: true
  cluster_related_reports: true
  scoring:
    engineering_relevance: 0.30
    strategic_impact: 0.25
    novelty: 0.20
    evidence_quality: 0.15
    durability_over_hype: 0.10
  rules:
    - "Evaluate stories by significance and evidence, not by which source surfaced them."
    - "Ben's Bites, AI Weekly and catalog sources receive no ranking bonus and no editorial priority."
    - "Do not include a story merely because a configured source mentioned it."
    - "Do not exclude a strong story merely because it came from a new or unknown source."
    - "For important stories, find the primary source whenever available."
    - "Actively search for credible disconfirming evidence before accepting dominant narratives or vendor claims."
    - "Detect cross-source emerging signals when multiple independent developments point in the same direction."
    - "Prefer a small number of well-explained high-signal stories over exhaustive link aggregation."
