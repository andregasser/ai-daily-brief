<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 573" role="img" aria-labelledby="title desc">
<title id="title">Three announced agent surfaces</title><desc id="desc">The capabilities address different tasks and have different access conditions; the graphic implies no shared reliability.</desc>
<rect width="420" height="573" rx="24" fill="#eff3f7"/>
<g font-family="sans-serif" fill="#233548">
<text x="24" y="36" font-size="23" font-weight="700">Three announced agent</text>
<text x="24" y="63" font-size="23" font-weight="700">surfaces</text>
<rect x="24" y="112" width="372" height="103" rx="18" fill="#dcecf5" stroke="#b3c1cd"/>
<circle cx="47" cy="141" r="11" fill="#416a83"/>
<text x="47" y="146" text-anchor="middle" font-size="14" fill="white">1</text>
<text x="67" y="146" font-size="21" font-weight="700">Dots</text>
<text x="42" y="176" font-size="19">Ongoing work; eligible plans and</text>
<text x="42" y="198" font-size="19">the admin-enabled beta differ.</text>
<rect x="24" y="255" width="372" height="125" rx="18" fill="#e1eddf" stroke="#b3c1cd"/>
<circle cx="47" cy="284" r="11" fill="#416a83"/>
<text x="47" y="289" text-anchor="middle" font-size="14" fill="white">2</text>
<text x="67" y="289" font-size="21" font-weight="700">Agents API</text>
<text x="42" y="319" font-size="19">Computer use, multi-agent</text>
<text x="42" y="341" font-size="19">capabilities, tool search and</text>
<text x="42" y="363" font-size="19">context compaction.</text>
<rect x="24" y="420" width="372" height="103" rx="18" fill="#e9e3f1" stroke="#b3c1cd"/>
<circle cx="47" cy="449" r="11" fill="#416a83"/>
<text x="47" y="454" text-anchor="middle" font-size="14" fill="white">3</text>
<text x="67" y="454" font-size="21" font-weight="700">Decisions API</text>
<text x="42" y="484" font-size="19">Luna-based and currently in</text>
<text x="42" y="506" font-size="19">limited preview.</text>
</g></svg>