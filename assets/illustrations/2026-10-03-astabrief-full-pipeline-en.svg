<title id="title">Asta: compare the full pipeline</title><desc id="desc">How large is the reported time difference per complete report, rather than text generation alone? Seconds per report: Fast 51.1; Thinking 178.5. The reported end-to-end advantage is approximately 3.5×, not nearly 10×. Ai2 averages for the complete pipeline; no independent replication or established quality parity. Most evaluation dates from 2025; do not confuse this with the separate nearly 10× generation claim.</desc>
