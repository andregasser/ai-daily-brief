<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 727.55" role="img" aria-labelledby="title desc">
<title id="title">Eine Auswahl statt freiem Text</title><desc id="desc">Was macht eine typisierte Entscheidung konkret überprüfbar? Ticket: «Die Rechnung wurde doppelt belastet.» Welches Team übernimmt? Zahlungen. Ergebnis: team = payments. Das Format ist prüfbar. Ob die Auswahl stimmt, zeigen erst gelabelte Testfälle. Illustratives Ticket-Beispiel mit selbst gewählten Kategorien. Kein gemessener Modelllauf und kein dokumentiertes API-Payload. Der manuelle Pfad ist eine Entwurfsentscheidung der Anwendung.</desc>
