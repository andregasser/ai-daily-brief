<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1154.45" role="img" aria-labelledby="title desc">
<title id="title">Gültiges JSON, unzulässige Zahlung</title><desc id="desc">Welche Prüfung stoppt eine formal passende, aber zu hohe Erstattung? Ausgabe: {&quot;refund_chf&quot;:125}; Richtlinienlimit: 100 CHF; belegter Kaufbetrag: 80 CHF. Darf die Anwendung auszahlen? Werte und Regeln prüfen. Auszahlung blockieren und zur Korrektur oder Prüfung weiterleiten; die JSON-Gültigkeit belegt kein korrektes Schlussfolgern.. Vor einer Zahlung müssen Werte- und Geschäftsregeln geprüft werden; parsebares JSON genügt nicht. Illustratives Beispiel, kein API-Payload oder gemessenes Modellergebnis. Die Beträge sind frei gewählte Beispieldaten; AWS dokumentiert die Grenze zwischen akzeptierten Schema-Vorgaben und Durchsetzung.</desc>
