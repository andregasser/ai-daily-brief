<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 669.85" role="img" aria-labelledby="title desc">
<title id="title">Mehr Umsatz, langsameres sequenzielles Wachstum</title><desc id="desc">Wie hat sich Anthropics gemeldeter Quartalsumsatz 2026 verändert? Milliarden US-Dollar pro Quartal: Q1 2026 4,7; Q2 2026 11,6; Q3 2026 16,8. Q3 liegt deutlich über Q2, aber der relative Zuwachs ist kleiner als beim Sprung von Q1 auf Q2. Gleiche Basis: gemeldeter Umsatz je Quartal, nicht annualisierte Run-Rate. Laut BBC privat gegenüber Investoren präsentierte Zahlen; keine geprüften öffentlichen Abschlüsse und kein Margennachweis.</desc>
<rect width="480" height="669.85" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif">
