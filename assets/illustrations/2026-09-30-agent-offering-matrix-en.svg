<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 743.2" role="img" aria-labelledby="title desc">
<title id="title">Which offering fits the task?</title><desc id="desc">How do Dots, Agents API and Decisions API differ? Unit of work: Dots — Ongoing task, Agents API — Software action, Decisions API — Single choice; Integration: Dots — Delegate, Agents API — Your app, Decisions API — Questions + choices; Access: Dots — Plan-dependent, Agents API — API + Work, Decisions API — Limited preview. Choose the unit of work first: ongoing work, software actions or a single choice. Announced functions, not a reliability ranking. Dots: depends on plan and market, with some admin-enabled betas. Agents API: via API; in Work/Codex on Pro 500 and Enterprise. Decisions: limited preview.</desc>
