<title id="title">Asta: die gesamte Pipeline vergleichen</title><desc id="desc">Wie gross ist der berichtete Zeitunterschied pro vollständigem Bericht, statt nur bei der Textgenerierung? Sekunden pro Bericht: Fast 51,1; Thinking 178,5. Der berichtete End-to-End-Vorteil beträgt ungefähr 3,5×, nicht nahezu 10×. Ai2-Durchschnittswerte der vollständigen Pipeline; keine unabhängige Replikation oder belegte Qualitätsgleichheit. Der Grossteil der Evaluation stammt aus 2025; nicht mit der separaten nahezu 10×-Generierungsbehauptung verwechseln.</desc>
