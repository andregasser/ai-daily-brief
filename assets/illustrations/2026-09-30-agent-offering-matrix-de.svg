<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 779.65" role="img" aria-labelledby="title desc">
<title id="title">Welches Angebot passt zur Aufgabe?</title><desc id="desc">Wie unterscheiden sich Dots, Agents API und Decisions API? Arbeitseinheit: Dots — Daueraufgabe, Agents API — Software-Aktion, Decisions API — Einzelauswahl; Einsatzpunkt: Dots — Delegieren, Agents API — Eigene App, Decisions API — Fragen + Auswahl; Zugang: Dots — Tarifabhängig, Agents API — API + Work, Decisions API — Begrenzte Vorschau. Zuerst die Arbeitseinheit wählen: Daueraufgabe, Software-Aktion oder einzelne Auswahl. Angekündigte Funktionen, keine Zuverlässigkeitsrangliste. Dots: je Tarif und Markt, teils Admin-Beta. Agents API: über API; in Work/Codex auf Pro 500 und Enterprise. Decisions: begrenzte Vorschau.</desc>
<rect width="480" height="779.65" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif">
