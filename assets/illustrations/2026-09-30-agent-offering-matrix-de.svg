<text x="310.667" y="426.1" font-size="19" fill="#233548" font-weight="400" text-anchor="start">Fragen +</text>
<text x="310.667" y="451.75" font-size="19" fill="#233548" font-weight="400" text-anchor="start">Auswahl</text>
<path d="M28 502.4 L452 502.4" stroke="#dce3e9" stroke-width="1" fill="none"/>
<text x="28" y="530.4" font-size="17" fill="#16786d" font-weight="700" text-anchor="start">Zugang</text>
<text x="28" y="563.35" font-size="19" fill="#233548" font-weight="400" text-anchor="start">Tarifabhängig</text>
<text x="169.333" y="563.35" font-size="19" fill="#233548" font-weight="400" text-anchor="start">API + Work</text>
