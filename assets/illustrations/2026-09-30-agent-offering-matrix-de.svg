<text x="28" y="672.65" font-size="20" fill="#233548" font-weight="600" text-anchor="start">Zuerst die Arbeitseinheit wählen:</text>
<text x="28" y="699.65" font-size="20" fill="#233548" font-weight="600" text-anchor="start">Daueraufgabe, Software-Aktion oder</text>
