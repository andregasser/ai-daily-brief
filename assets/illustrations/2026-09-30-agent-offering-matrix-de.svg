<text x="310.667" y="288.85" font-size="19" fill="#233548" font-weight="400" text-anchor="start">Einzelauswahl</text>
<path d="M28 365.15 L452 365.15" stroke="#dce3e9" stroke-width="1" fill="none"/>
<text x="28" y="393.15" font-size="17" fill="#16786d" font-weight="700" text-anchor="start">Einsatzpunkt</text>
