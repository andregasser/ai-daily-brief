<text x="100" y="204.25" font-size="21" fill="#233548" font-weight="400" text-anchor="start">same monthly fee twice;</text>
<text x="100" y="232.6" font-size="21" fill="#233548" font-weight="400" text-anchor="start">please correct it.”</text>
