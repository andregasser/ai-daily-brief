<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 922.05" role="img" aria-labelledby="title desc">
<title id="title">Routing is not authorization to act</title><desc id="desc">What can a bounded ticket decision provide without authorizing a refund? “My invoice contains the same monthly fee twice; please correct it.” Which team should handle this? Billing. Intended example route: billing; assign the ticket, do not trigger an automatic refund.. A structured decision can select the responsible team while authorization to move money is checked separately. Illustrative application example following the d1 release&#x27;s decision principle, not a measured model output or real API payload; an allowed label establishes neither correct reasoning nor general accuracy.</desc>
<rect width="480" height="922.05" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif">
