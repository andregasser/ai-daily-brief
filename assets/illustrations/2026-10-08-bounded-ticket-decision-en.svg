<circle cx="240" cy="423" r="5" fill="#64748b"/>
<text x="240" y="456" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">Technical</text>
<text x="240" y="483" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">support</text>
<path d="M381.333 388 L381.333 422" stroke="#64748b" stroke-width="1" fill="none" stroke-dasharray="4 5"/>
<circle cx="381.333" cy="423" r="5" fill="#64748b"/>
<text x="381.333" y="456" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">Human review</text>
<text x="98.6667" y="520" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Charges,</text>
<text x="98.6667" y="542.95" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">invoices and</text>
<text x="98.6667" y="565.9" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">refund</text>
<text x="98.6667" y="588.85" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">requests</text>
<text x="240" y="520" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">App or website</text>
<text x="240" y="542.95" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">faults</text>
<text x="381.333" y="520" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Ambiguous or</text>
