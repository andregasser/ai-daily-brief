<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1080.1" role="img" aria-labelledby="title desc">
<title id="title">Reicht das Restbudget für den nächsten Aufruf?</title><desc id="desc">Wie verändert reservierte Arbeit die Entscheidung über einen neuen kostenpflichtigen Aufruf? Budget USD 10 · abgerechnet USD 8 · reserviert USD 1 · nächster Aufruf höchstens USD 2 8 + 1 + 2 ≤ 10? Ablehnen und pausieren. Kein neuer Aufruf autorisiert; die Aufgabe bleibt unvollständig und ihr Backend-Zustand muss separat geprüft werden.. Bereits reservierte Kosten zählen mit: Der nächste Aufruf wird vor dem Start gestoppt, nicht erst nach einer Warnung. Illustratives Designbeispiel, kein gemessener Agentenlauf oder realer API-Payload. Angenommene Beträge in USD; eine korrekte Budgetentscheidung beweist keine korrekte fachliche Bearbeitung.</desc>
