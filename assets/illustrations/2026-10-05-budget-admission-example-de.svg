<text x="28" y="68" font-size="27" fill="#233548" font-weight="700" text-anchor="start">Reicht das Restbudget für den</text>
<text x="28" y="104.45" font-size="27" fill="#233548" font-weight="700" text-anchor="start">nächsten Aufruf?</text>
