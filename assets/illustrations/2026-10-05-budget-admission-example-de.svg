<circle cx="240" cy="479.7" r="5" fill="#16786d"/>
<text x="240" y="512.7" font-size="20" fill="#16786d" font-weight="700" text-anchor="middle">Ablehnen und</text>
<text x="240" y="539.7" font-size="20" fill="#16786d" font-weight="700" text-anchor="middle">pausieren</text>
<path d="M381.333 444.7 L381.333 478.7" stroke="#64748b" stroke-width="1" fill="none" stroke-dasharray="4 5"/>
<circle cx="381.333" cy="479.7" r="5" fill="#64748b"/>
<text x="381.333" y="512.7" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">Nur warnen</text>
<text x="98.6667" y="576.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Nur wenn die</text>
<text x="98.6667" y="599.65" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Summe das</text>
<text x="98.6667" y="622.6" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Budget nicht</text>
<text x="98.6667" y="645.55" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">überschreitet.</text>
<text x="240" y="576.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Hier: USD 11 &gt;</text>
<text x="240" y="599.65" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">USD 10;</text>
<text x="240" y="622.6" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Teilstand</text>
<text x="240" y="645.55" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">sichern,</text>
<text x="240" y="668.5" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Freigabe</text>
<text x="240" y="691.45" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">anfordern.</text>
