<text x="28" y="836.4" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">ihr Backend-Zustand muss separat</text>
<text x="28" y="864.75" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">geprüft werden.</text>
<path d="M28 913.1 L452 913.1" stroke="#16786d" stroke-width="2" fill="none"/>
