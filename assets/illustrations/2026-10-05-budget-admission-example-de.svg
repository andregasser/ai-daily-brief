<text x="381.333" y="599.65" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Grenze:</text>
<text x="381.333" y="622.6" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">weitere</text>
<text x="381.333" y="645.55" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Ausgabe bleibt</text>
<text x="381.333" y="668.5" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">möglich.</text>
