<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 727.55" role="img" aria-labelledby="title desc">
<title id="title">A choice instead of free text</title><desc id="desc">What makes a typed decision concretely testable? Ticket: “I was charged twice.” Which team takes ownership? Payments. Result: team = payments. The format is testable. Labeled test cases establish whether the choice is correct. Illustrative ticket example with application-defined categories. Not a measured model run or documented API payload. The manual path is an application design choice.</desc>
