<text x="28" y="397.85" font-size="21" fill="#233548" font-weight="600" text-anchor="start">25% Ersetzung</text>
<rect class="data-bar" data-value="17" x="28" y="431.2" width="72.0652" height="19" rx="2" fill="#16786d"/>
