<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 696.85" role="img" aria-labelledby="title desc">
<title id="title">Bearbeitung schwächt das Wasserzeichen</title><desc id="desc">Wie verändert Synonymersetzung die Erkennung im selben 400-Token-Test? Erkennungsrate (%): Ohne Ersetzung 92; 10% Ersetzung 66; 25% Ersetzung 17. Schon 10% Synonymersetzung reduziert die berichtete Erkennung deutlich; fehlende Detektion ist kein Beweis menschlicher Urheberschaft. OpenAI-Herstellertest mit englischen, wasserzeichenmarkierten ELI5-Antworten von 400 Tokens; Werte gerundet. Separat von den Psychologietests, nicht unabhängig validiert und nicht auf beliebige Texte übertragbar.</desc>
