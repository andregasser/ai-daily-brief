<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1151.8" role="img" aria-labelledby="title desc">
<title id="title">Connector aus: Ist der Zugriff wirklich gesperrt?</title><desc id="desc">Welche Sicherheitsfolgerung erlaubt ein deaktivierter Connector bei weiterhin gewährtem Full Disk Access? Recherche-Agent: Messages-Connector deaktiviert, Full Disk Access weiterhin gewährt. Ist technische Nichterreichbarkeit belegt? Nein, Rechte separat prüfen. Freigabe pausieren und effektive Rechte klären; weder sicheren Ausschluss noch einen konkreten Zugriff behaupten.. Der Schalter belegt die Präferenz; erst durchgesetzte Rechte belegen die Zugriffsgrenze. Illustratives Entscheidungsbeispiel, kein Muse-Test und kein reales API-Payload; eine formal gültige Statusmeldung beweist keine korrekte Sicherheitsfolgerung.</desc>
<rect width="480" height="1151.8" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="32" font-size="13" fill="#16786d" font-weight="700" text-anchor="start">ILLUSTRATIVES BEISPIEL</text>
<text x="28" y="68" font-size="27" fill="#233548" font-weight="700" text-anchor="start">Connector aus: Ist der Zugriff</text>
<text x="28" y="104.45" font-size="27" fill="#233548" font-weight="700" text-anchor="start">wirklich gesperrt?</text>
<path d="M32 155.9 h34 l12 12 v43 h-46 z M66 155.9 v12 h12 M42 182.9 h24 M42 193.9 h20" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="100" y="175.9" font-size="21" fill="#233548" font-weight="400" text-anchor="start">Recherche-Agent:</text>
<text x="100" y="204.25" font-size="21" fill="#233548" font-weight="400" text-anchor="start">Messages-Connector</text>
<text x="100" y="232.6" font-size="21" fill="#233548" font-weight="400" text-anchor="start">deaktiviert, Full Disk</text>
<text x="100" y="260.95" font-size="21" fill="#233548" font-weight="400" text-anchor="start">Access weiterhin gewährt.</text>
<path d="M240 304.3 L240 329.3" stroke="#16786d" stroke-width="2" fill="none"/>
<text x="240" y="359.3" font-size="23" fill="#233548" font-weight="700" text-anchor="middle">Ist technische</text>
<text x="240" y="390.35" font-size="23" fill="#233548" font-weight="700" text-anchor="middle">Nichterreichbarkeit belegt?</text>
<path d="M240 425.4 L240 447.4" stroke="#64748b" stroke-width="1" fill="none"/>
<path d="M98.6667 447.4 L381.333 447.4" stroke="#64748b" stroke-width="1" fill="none"/>
<path d="M98.6667 447.4 L98.6667 481.4" stroke="#64748b" stroke-width="1" fill="none" stroke-dasharray="4 5"/>
<circle cx="98.6667" cy="482.4" r="5" fill="#64748b"/>
<text x="98.6667" y="515.4" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">Ja, weil</text>
<text x="98.6667" y="542.4" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">Connector</text>
<text x="98.6667" y="569.4" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">aus</text>
<path d="M240 447.4 L240 481.4" stroke="#16786d" stroke-width="3" fill="none"/>
<circle cx="240" cy="482.4" r="5" fill="#16786d"/>
<text x="240" y="515.4" font-size="20" fill="#16786d" font-weight="700" text-anchor="middle">Nein, Rechte</text>
<text x="240" y="542.4" font-size="20" fill="#16786d" font-weight="700" text-anchor="middle">separat</text>
<text x="240" y="569.4" font-size="20" fill="#16786d" font-weight="700" text-anchor="middle">prüfen</text>
<path d="M381.333 447.4 L381.333 481.4" stroke="#64748b" stroke-width="1" fill="none" stroke-dasharray="4 5"/>
<circle cx="381.333" cy="482.4" r="5" fill="#64748b"/>
<text x="381.333" y="515.4" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">Konkreten</text>
<text x="381.333" y="542.4" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">Zugriff</text>
<text x="381.333" y="569.4" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">behaupten</text>
<text x="98.6667" y="606.4" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Unzulässiger</text>
<text x="98.6667" y="629.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Schluss: Produ</text>
<text x="98.6667" y="652.3" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">ktpräferenz</text>
<text x="98.6667" y="675.25" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">wird mit</text>
<text x="98.6667" y="698.2" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">entzogenen</text>
<text x="98.6667" y="721.15" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Prozessrechten</text>
<text x="98.6667" y="744.1" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">gleichgesetzt.</text>
<text x="240" y="606.4" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Integration</text>
<text x="240" y="629.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">ist</text>
<text x="240" y="652.3" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">deaktiviert;</text>
<text x="240" y="675.25" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">tatsächliche Z</text>
<text x="240" y="698.2" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">ugriffsverweig</text>
<text x="240" y="721.15" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">erung muss</text>
<text x="240" y="744.1" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">separat</text>
<text x="240" y="767.05" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">nachgewiesen</text>
<text x="240" y="790" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">werden.</text>
<text x="381.333" y="606.4" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Ebenfalls</text>
<text x="381.333" y="629.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">unbelegt:</text>
<text x="381.333" y="652.3" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">breite Rechte</text>
<text x="381.333" y="675.25" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">beweisen</text>
<text x="381.333" y="698.2" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">nicht, dass</text>
<text x="381.333" y="721.15" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">dieser Agent</text>
<text x="381.333" y="744.1" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">diese Daten</text>
<text x="381.333" y="767.05" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">gelesen hat.</text>
<path d="M28 843.4 L452 843.4" stroke="#dce3e9" stroke-width="1" fill="none"/>
<text x="28" y="878.4" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">Freigabe pausieren und effektive</text>
<text x="28" y="906.75" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">Rechte klären; weder sicheren</text>
<text x="28" y="935.1" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">Ausschluss noch einen konkreten</text>
<text x="28" y="963.45" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">Zugriff behaupten.</text>
<path d="M28 1011.8 L452 1011.8" stroke="#16786d" stroke-width="2" fill="none"/>
<text x="28" y="1044.8" font-size="20" fill="#233548" font-weight="600" text-anchor="start">Der Schalter belegt die Präferenz;</text>
<text x="28" y="1071.8" font-size="20" fill="#233548" font-weight="600" text-anchor="start">erst durchgesetzte Rechte belegen</text>
<text x="28" y="1098.8" font-size="20" fill="#233548" font-weight="600" text-anchor="start">die Zugriffsgrenze.</text>
</g></svg>