<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" role="img" aria-labelledby="title desc">
<title id="title">Announced review and unresolved powers</title><desc id="desc">The reported structure is more specific than a general pledge; an enforceable release right is unverified.</desc>
<rect width="420" height="430" rx="24" fill="#eff3f7"/>
<g font-family="sans-serif" fill="#233548">
<text x="24" y="36" font-size="23" font-weight="700">Announced review and</text>
<text x="24" y="63" font-size="23" font-weight="700">unresolved powers</text>
<rect x="24" y="112" width="372" height="125" rx="18" fill="#dcecf5" stroke="#b3c1cd"/>
<circle cx="47" cy="141" r="11" fill="#416a83"/>
<text x="47" y="146" text-anchor="middle" font-size="14" fill="white">1</text>
<text x="67" y="146" font-size="21" font-weight="700">Reported</text>
<text x="42" y="176" font-size="19">Internal controls, an external</text>
<text x="42" y="198" font-size="19">auditor and board-committee</text>
<text x="42" y="220" font-size="19">review.</text>
<rect x="24" y="277" width="372" height="103" rx="18" fill="#e1eddf" stroke="#b3c1cd"/>
<circle cx="47" cy="306" r="11" fill="#416a83"/>
<text x="47" y="311" text-anchor="middle" font-size="14" fill="white">2</text>
<text x="67" y="311" font-size="21" font-weight="700">Unverified</text>
<text x="42" y="341" font-size="19">Signed text and auditors’ access,</text>
<text x="42" y="363" font-size="19">escalation and release rights.</text>
</g></svg>