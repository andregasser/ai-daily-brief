<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 452" role="img" aria-labelledby="title desc">
<title id="title">Angekündigte Prüfung und offene Befugnisse</title><desc id="desc">Die berichtete Struktur ist konkreter als ein allgemeines Versprechen; ein durchsetzbares Freigaberecht ist nicht verifiziert.</desc>
<rect width="420" height="452" rx="24" fill="#eff3f7"/>
<g font-family="sans-serif" fill="#233548">
<text x="24" y="36" font-size="23" font-weight="700">Angekündigte Prüfung und</text>
<text x="24" y="63" font-size="23" font-weight="700">offene Befugnisse</text>
<rect x="24" y="112" width="372" height="125" rx="18" fill="#dcecf5" stroke="#b3c1cd"/>
<circle cx="47" cy="141" r="11" fill="#416a83"/>
<text x="47" y="146" text-anchor="middle" font-size="14" fill="white">1</text>
<text x="67" y="146" font-size="21" font-weight="700">Berichtet</text>
<text x="42" y="176" font-size="19">Interne Kontrollen, externer</text>
<text x="42" y="198" font-size="19">Prüfer und Prüfung durch einen</text>
<text x="42" y="220" font-size="19">Verwaltungsratsausschuss.</text>
<rect x="24" y="277" width="372" height="125" rx="18" fill="#e1eddf" stroke="#b3c1cd"/>
<circle cx="47" cy="306" r="11" fill="#416a83"/>
<text x="47" y="311" text-anchor="middle" font-size="14" fill="white">2</text>
<text x="67" y="311" font-size="21" font-weight="700">Nicht verifiziert</text>
<text x="42" y="341" font-size="19">Unterzeichneter Text sowie</text>
<text x="42" y="363" font-size="19">Zugang, Eskalation und</text>
<text x="42" y="385" font-size="19">Freigaberechte der Prüfer.</text>
</g></svg>