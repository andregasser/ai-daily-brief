<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 595" role="img" aria-labelledby="title desc">
<title id="title">Vom Zustand zur typisierten Entscheidung</title><desc id="desc">Ollamas beschriebene Schnittstelle formt die Ausgabe; ihre Genauigkeit muss separat gemessen werden.</desc>
<rect width="420" height="595" rx="24" fill="#eff3f7"/>
<g font-family="sans-serif" fill="#233548">
<text x="24" y="36" font-size="23" font-weight="700">Vom Zustand zur typisierten</text>
<text x="24" y="63" font-size="23" font-weight="700">Entscheidung</text>
<rect x="24" y="112" width="372" height="103" rx="18" fill="#dcecf5" stroke="#b3c1cd"/>
<circle cx="47" cy="141" r="11" fill="#416a83"/>
<text x="47" y="146" text-anchor="middle" font-size="14" fill="white">1</text>
<text x="67" y="146" font-size="21" font-weight="700">Zustand</text>
<text x="42" y="176" font-size="19">Die Anwendung liefert den</text>
<text x="42" y="198" font-size="19">relevanten Fallkontext.</text>
<path d="M210 222 v23 m-7 -7 l7 7 7 -7" fill="none" stroke="#416a83" stroke-width="3"/>
<rect x="24" y="255" width="372" height="125" rx="18" fill="#e1eddf" stroke="#b3c1cd"/>
<circle cx="47" cy="284" r="11" fill="#416a83"/>
<text x="47" y="289" text-anchor="middle" font-size="14" fill="white">2</text>
<text x="67" y="289" font-size="21" font-weight="700">Benannte Fragen</text>
<text x="42" y="319" font-size="19">Der Aufruf an /v1/systemone</text>
<text x="42" y="341" font-size="19">spezifiziert die benötigten</text>
<text x="42" y="363" font-size="19">Entscheidungen.</text>
<path d="M210 387 v23 m-7 -7 l7 7 7 -7" fill="none" stroke="#416a83" stroke-width="3"/>
<rect x="24" y="420" width="372" height="125" rx="18" fill="#e9e3f1" stroke="#b3c1cd"/>
<circle cx="47" cy="449" r="11" fill="#416a83"/>
<text x="47" y="454" text-anchor="middle" font-size="14" fill="white">3</text>
<text x="67" y="454" font-size="21" font-weight="700">Typisierte Antworten</text>
<text x="42" y="484" font-size="19">Die Anwendung erhält</text>
<text x="42" y="506" font-size="19">strukturierte Entscheidungen,</text>
<text x="42" y="528" font-size="19">nicht einen Genauigkeitsnachweis.</text>
</g></svg>