<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 573" role="img" aria-labelledby="title desc">
<title id="title">From state to typed decision</title><desc id="desc">Ollama’s described interface shapes the output; its accuracy must be measured separately.</desc>
<rect width="420" height="573" rx="24" fill="#eff3f7"/>
<g font-family="sans-serif" fill="#233548">
<text x="24" y="36" font-size="23" font-weight="700">From state to typed</text>
<text x="24" y="63" font-size="23" font-weight="700">decision</text>
<rect x="24" y="112" width="372" height="103" rx="18" fill="#dcecf5" stroke="#b3c1cd"/>
<circle cx="47" cy="141" r="11" fill="#416a83"/>
<text x="47" y="146" text-anchor="middle" font-size="14" fill="white">1</text>
<text x="67" y="146" font-size="21" font-weight="700">State</text>
<text x="42" y="176" font-size="19">The application supplies the</text>
<text x="42" y="198" font-size="19">relevant case context.</text>
<path d="M210 222 v23 m-7 -7 l7 7 7 -7" fill="none" stroke="#416a83" stroke-width="3"/>
<rect x="24" y="255" width="372" height="103" rx="18" fill="#e1eddf" stroke="#b3c1cd"/>
<circle cx="47" cy="284" r="11" fill="#416a83"/>
<text x="47" y="289" text-anchor="middle" font-size="14" fill="white">2</text>
<text x="67" y="289" font-size="21" font-weight="700">Named questions</text>
<text x="42" y="319" font-size="19">The /v1/systemone request</text>
<text x="42" y="341" font-size="19">specifies the needed decisions.</text>
<path d="M210 365 v23 m-7 -7 l7 7 7 -7" fill="none" stroke="#416a83" stroke-width="3"/>
<rect x="24" y="398" width="372" height="125" rx="18" fill="#e9e3f1" stroke="#b3c1cd"/>
<circle cx="47" cy="427" r="11" fill="#416a83"/>
<text x="47" y="432" text-anchor="middle" font-size="14" fill="white">3</text>
<text x="67" y="432" font-size="21" font-weight="700">Typed answers</text>
<text x="42" y="462" font-size="19">The application receives</text>
<text x="42" y="484" font-size="19">structured decisions, not proof</text>
<text x="42" y="506" font-size="19">of accuracy.</text>
</g></svg>