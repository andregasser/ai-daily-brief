<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 573" role="img" aria-labelledby="title desc">
<title id="title">Three different boundaries for agents</title><desc id="desc">Product surface, voluntary oversight and litigation are distinct developments; none alone establishes safe autonomous work.</desc>
<rect width="420" height="573" rx="24" fill="#eff3f7"/>
<g font-family="sans-serif" fill="#233548">
<text x="24" y="36" font-size="23" font-weight="700">Three different boundaries</text>
<text x="24" y="63" font-size="23" font-weight="700">for agents</text>
<rect x="24" y="112" width="372" height="103" rx="18" fill="#dcecf5" stroke="#b3c1cd"/>
<circle cx="47" cy="141" r="11" fill="#416a83"/>
<text x="47" y="146" text-anchor="middle" font-size="14" fill="white">1</text>
<text x="67" y="146" font-size="21" font-weight="700">Execution</text>
<text x="42" y="176" font-size="19">OpenAI announces ongoing work and</text>
<text x="42" y="198" font-size="19">computer use.</text>
<rect x="24" y="255" width="372" height="125" rx="18" fill="#e1eddf" stroke="#b3c1cd"/>
<circle cx="47" cy="284" r="11" fill="#416a83"/>
<text x="47" y="289" text-anchor="middle" font-size="14" fill="white">2</text>
<text x="67" y="289" font-size="21" font-weight="700">Review</text>
<text x="42" y="319" font-size="19">Reported US accord names external</text>
<text x="42" y="341" font-size="19">auditors, but no verified release</text>
<text x="42" y="363" font-size="19">authority.</text>
<rect x="24" y="420" width="372" height="103" rx="18" fill="#e9e3f1" stroke="#b3c1cd"/>
<circle cx="47" cy="449" r="11" fill="#416a83"/>
<text x="47" y="454" text-anchor="middle" font-size="14" fill="white">3</text>
<text x="67" y="454" font-size="21" font-weight="700">Liability question</text>
<text x="42" y="484" font-size="19">A complaint alleges improper</text>
<text x="42" y="506" font-size="19">agent access; there is no ruling.</text>
</g></svg>