<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1008.45" role="img" aria-labelledby="title desc">
<title id="title">Routing ist noch keine Handlungsberechtigung</title><desc id="desc">Was kann eine begrenzte Ticket-Entscheidung liefern, ohne eine Rückzahlung zu autorisieren? «Meine Rechnung enthält dieselbe Monatsgebühr zweimal; bitte korrigieren.» Welches Team soll das bearbeiten? Abrechnung. Vorgesehene Beispielroute: Abrechnung; Ticket zuweisen, keine automatische Rückzahlung auslösen.. Eine strukturierte Entscheidung kann das zuständige Team auswählen, während die Berechtigung zur Geldbewegung separat geprüft wird. Illustratives Anwendungsbeispiel nach dem Entscheidungsprinzip des d1-Releases, kein gemessener Modelloutput und kein echter API-Payload; ein zulässiges Label belegt weder korrektes Reasoning noch allgemeine Genauigkeit.</desc>
<rect width="480" height="1008.45" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="32" font-size="13" fill="#16786d" font-weight="700" text-anchor="start">ILLUSTRATIVES BEISPIEL</text>
<text x="28" y="68" font-size="27" fill="#233548" font-weight="700" text-anchor="start">Routing ist noch keine</text>
<text x="28" y="104.45" font-size="27" fill="#233548" font-weight="700" text-anchor="start">Handlungsberechtigung</text>
