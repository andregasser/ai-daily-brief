<text x="28" y="756.7" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">Block payment and route to</text>
<text x="28" y="785.05" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">correction or review; JSON</text>
<text x="28" y="813.4" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">validity does not establish</text>
<text x="28" y="841.75" font-size="21" fill="#16786d" font-weight="600" text-anchor="start">correct reasoning.</text>
<path d="M28 890.1 L452 890.1" stroke="#16786d" stroke-width="2" fill="none"/>
<text x="28" y="923.1" font-size="20" fill="#233548" font-weight="600" text-anchor="start">Value and business rules must be</text>
<text x="28" y="950.1" font-size="20" fill="#233548" font-weight="600" text-anchor="start">checked before payment; parseable</text>
<text x="28" y="977.1" font-size="20" fill="#233548" font-weight="600" text-anchor="start">JSON is insufficient.</text>
</g></svg>