<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1030.1" role="img" aria-labelledby="title desc">
<title id="title">Valid JSON, impermissible payment</title><desc id="desc">Which check stops a structurally valid but excessive refund? Output: {&quot;refund_chf&quot;:125}; policy limit: CHF 100; documented purchase amount: CHF 80. May the application pay? Check values and rules. Block payment and route to correction or review; JSON validity does not establish correct reasoning.. Value and business rules must be checked before payment; parseable JSON is insufficient. Illustrative example, not an API payload or measured model result. Amounts are invented example inputs; AWS documents the boundary between accepted schema requirements and enforcement.</desc>
<rect width="480" height="1030.1" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="32" font-size="13" fill="#16786d" font-weight="700" text-anchor="start">ILLUSTRATIVE EXAMPLE</text>
<text x="28" y="68" font-size="27" fill="#233548" font-weight="700" text-anchor="start">Valid JSON, impermissible</text>
<text x="28" y="104.45" font-size="27" fill="#233548" font-weight="700" text-anchor="start">payment</text>
<path d="M32 155.9 h34 l12 12 v43 h-46 z M66 155.9 v12 h12 M42 182.9 h24 M42 193.9 h20" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="100" y="175.9" font-size="21" fill="#233548" font-weight="400" text-anchor="start">Output:</text>
<text x="100" y="204.25" font-size="21" fill="#233548" font-weight="400" text-anchor="start">{&quot;refund_chf&quot;:125};</text>
<text x="100" y="232.6" font-size="21" fill="#233548" font-weight="400" text-anchor="start">policy limit: CHF 100;</text>
<text x="100" y="260.95" font-size="21" fill="#233548" font-weight="400" text-anchor="start">documented purchase</text>
<text x="100" y="289.3" font-size="21" fill="#233548" font-weight="400" text-anchor="start">amount: CHF 80.</text>
<path d="M240 332.65 L240 357.65" stroke="#16786d" stroke-width="2" fill="none"/>
<text x="240" y="387.65" font-size="23" fill="#233548" font-weight="700" text-anchor="middle">May the application pay?</text>
<path d="M240 422.7 L240 444.7" stroke="#64748b" stroke-width="1" fill="none"/>
<path d="M98.6667 444.7 L381.333 444.7" stroke="#64748b" stroke-width="1" fill="none"/>
<path d="M98.6667 444.7 L98.6667 478.7" stroke="#64748b" stroke-width="1" fill="none" stroke-dasharray="4 5"/>
<circle cx="98.6667" cy="479.7" r="5" fill="#64748b"/>
<text x="98.6667" y="512.7" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">Check JSON</text>
<text x="98.6667" y="539.7" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">only</text>
<path d="M240 444.7 L240 478.7" stroke="#16786d" stroke-width="3" fill="none"/>
<circle cx="240" cy="479.7" r="5" fill="#16786d"/>
<text x="240" y="512.7" font-size="20" fill="#16786d" font-weight="700" text-anchor="middle">Check values</text>
<text x="240" y="539.7" font-size="20" fill="#16786d" font-weight="700" text-anchor="middle">and rules</text>
<path d="M381.333 444.7 L381.333 478.7" stroke="#64748b" stroke-width="1" fill="none" stroke-dasharray="4 5"/>
<circle cx="381.333" cy="479.7" r="5" fill="#64748b"/>
<text x="381.333" y="512.7" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">Generate</text>
<text x="381.333" y="539.7" font-size="20" fill="#64748b" font-weight="700" text-anchor="middle">again</text>
<text x="98.6667" y="576.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">Numerical</text>
<text x="98.6667" y="599.65" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">field parses;</text>
<text x="98.6667" y="622.6" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">the excessive</text>
<text x="98.6667" y="645.55" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">payment would</text>
<text x="98.6667" y="668.5" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">go undetected.</text>
<text x="240" y="576.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">125 exceeds</text>
<text x="240" y="599.65" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">both the limit</text>
<text x="240" y="622.6" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">of 100 and the</text>
<text x="240" y="645.55" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">purchase</text>
<text x="240" y="668.5" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">amount of 80.</text>
<text x="381.333" y="576.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">A new answer</text>
<text x="381.333" y="599.65" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">needs the same</text>
<text x="381.333" y="622.6" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">checks;</text>
<text x="381.333" y="645.55" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">retrying is</text>
<text x="381.333" y="668.5" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">not approval.</text>
