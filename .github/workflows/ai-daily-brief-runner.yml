name: AI Daily Brief publishing runner

on:
  push:
    paths:
      - 'automation/run_daily.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate briefing and update intelligence data
        run: python3 automation/run_daily.py
      - name: Commit generated brief
        run: |
          git config user.name "AI Daily Brief"
          git config user.email "actions@users.noreply.github.com"
          git add briefings weekly data
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          RUN_DATE=$(python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('automation/run_daily.py').read_text(encoding='utf-8')
          match = re.search(r'^DATE = "([^"]+)"', text, re.MULTILINE)
          print(match.group(1) if match else 'daily-run')
          PY
          )
          git commit -m "Publish AI Daily Brief ${RUN_DATE}"
          git push
