name: Publish AI Daily Brief

on:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'config/daily_brief.schema.json'
      - '.github/codex/prompts/publish-daily-brief.md'
      - '.github/workflows/ai-daily-brief-runner.yml'
  schedule:
    # GitHub cron is UTC. Select the matching run below so publication stays
    # at 07:00 Europe/Zurich across CET and CEST changes.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ai-daily-brief-publisher
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.schedule.outputs.should_run }}
      run_date: ${{ steps.schedule.outputs.run_date }}
    steps:
      - name: Select the 07:00 Zurich run
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          run_date=$(TZ=Europe/Zurich date +%F)
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          offset=$(TZ=Europe/Zurich date +%z)
          if [ "$offset" = "+0200" ]; then
            expected_schedule='0 5 * * *'
          else
            expected_schedule='0 6 * * *'
          fi

          if [ "$EVENT_SCHEDULE" = "$expected_schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation dependency
        run: python3 -m pip install -r automation/requirements.txt

      - name: Check for an existing valid edition
        id: existing
        env:
          RUN_DATE: ${{ needs.prepare.outputs.run_date }}
        run: |
          if [ -f "briefings/$RUN_DATE-de.html" ] && python3 automation/validate_daily.py "$RUN_DATE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find recent failed checkpoint
        id: checkpoint
        if: steps.existing.outputs.exists != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ai-daily-brief-runner.yml/runs?status=failure&branch=main&per_page=1" --jq '.workflow_runs[0] | [.id, .head_sha, .created_at] | @tsv')
          read -r run_id revision created_at <<< "$candidate"
          if [[ "$run_id" =~ ^[0-9]+$ && "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            age=$(( $(date +%s) - $(date -d "$created_at" +%s) ))
            if [ "$age" -ge 0 ] && [ "$age" -le 1800 ] && git diff --quiet "$revision" HEAD -- config .github/codex/prompts; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download recent checkpoint
        if: steps.checkpoint.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: daily-brief-diagnostics-${{ steps.checkpoint.outputs.run_id }}
          path: ${{ runner.temp }}/brief-checkpoint
          github-token: ${{ github.token }}
          run-id: ${{ steps.checkpoint.outputs.run_id }}

      - name: Validate and restore completed phases
        id: restore
        if: steps.checkpoint.outputs.run_id != ''
        env:
          CHECKPOINT_DIR: ${{ runner.temp }}/brief-checkpoint
        run: python3 automation/restore_checkpoint.py "${{ needs.prepare.outputs.run_date }}" "$CHECKPOINT_DIR"

      - name: Prepare feeds, evidence and compact context
        if: steps.existing.outputs.exists != 'true' && steps.restore.outputs.restored != 'true'
        run: python3 automation/run_step.py prepare --timeout 90 -- python3 automation/prepare_daily_context.py "${{ needs.prepare.outputs.run_date }}"

      - name: Research, write and independently review
        if: steps.existing.outputs.exists != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 automation/run_step.py generate --timeout 465 -- python3 -u automation/generate_daily.py "${{ needs.prepare.outputs.run_date }}"

      - name: Render reviewed content and update intelligence
        if: steps.existing.outputs.exists != 'true'
        run: python3 automation/run_step.py render --timeout 30 -- python3 automation/render_daily.py .ai-daily/daily-brief.json --date "${{ needs.prepare.outputs.run_date }}" --approved

      - name: Validate publication
        if: steps.existing.outputs.exists != 'true'
        run: python3 automation/run_step.py validate --timeout 30 -- python3 automation/validate_daily.py "${{ needs.prepare.outputs.run_date }}"

      - name: Package generated changes
        if: steps.existing.outputs.exists != 'true'
        id: patch
        run: |
          git diff --check
          git add -N briefings weekly data assets/illustrations
          git diff --binary HEAD -- briefings weekly data assets/illustrations > daily-brief.patch
          if [ -s daily-brief.patch ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated patch
        if: steps.patch.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-${{ needs.prepare.outputs.run_date }}
          path: daily-brief.patch
          if-no-files-found: error
          retention-days: 7

      - name: Summarize stage timings
        if: always()
        run: python3 automation/run_step.py summary

      - name: Preserve diagnostics and intermediate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-diagnostics-${{ github.run_id }}
          path: .ai-daily/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [prepare, generate]
    timeout-minutes: 6
    if: needs.generate.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Apply the generated patch on the current branch tip, including any
          # independent changes committed during the editorial API calls.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download generated patch
        uses: actions/download-artifact@v4
        with:
          name: daily-brief-${{ needs.prepare.outputs.run_date }}

      - name: Install validation dependency
        run: python3 -m pip install -r automation/requirements.txt

      - name: Apply and validate briefing
        env:
          RUN_DATE: ${{ needs.prepare.outputs.run_date }}
        run: |
          git apply --index daily-brief.patch
          while IFS= read -r path; do
            case "$path" in
              briefings/*|weekly/*|data/*|assets/illustrations/*) ;;
              *)
                echo "Generated patch changed a disallowed path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)
          python3 automation/validate_daily.py "$RUN_DATE"
          rm daily-brief.patch

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser publishing tests
        env:
          BRIEF_DATE: ${{ needs.prepare.outputs.run_date }}
          BRIEF_DATES: ${{ needs.prepare.outputs.run_date }}
          BRIEF_URL: http://127.0.0.1:8766/
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/ai-daily-brief-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused "$BRIEF_URL" > /dev/null
          npm run test:browser

      - name: Commit and publish
        if: github.ref == 'refs/heads/main'
        env:
          RUN_DATE: ${{ needs.prepare.outputs.run_date }}
        run: |
          git config user.name "AI Daily Brief"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings weekly data assets/illustrations
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Publish AI Daily Brief ${RUN_DATE}"
          git push origin HEAD:main
