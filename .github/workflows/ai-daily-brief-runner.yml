name: AI Daily Brief publishing runner

on:
  push:
    paths:
      - 'automation/run_daily.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate briefing and update intelligence data
        run: python3 automation/run_daily.py
      - name: Commit generated brief
        run: |
          git config user.name "AI Daily Brief"
          git config user.email "actions@users.noreply.github.com"
          git add briefings weekly data
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Publish AI Daily Brief 2026-09-20"
          git push
